services:
  - type: web
    name: math-thinking-lab
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:render
    healthCheckPath: /api/status
    disk:
      name: math-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: MATH_DB_PATH
        value: /var/data/math-lab/accounts.json
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
